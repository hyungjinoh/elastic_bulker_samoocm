### HTTPS(SSL) 인증서 검증 설정 - BulkerUtils.getInstanceRestTemplateSsl
### (1) 신뢰저장소 사용(권장): CA/자체서명 인증서를 등록한 truststore 경로/비밀번호
#ES.SSL.TRUSTSTORE.PATH=/path/to/truststore.p12
#ES.SSL.TRUSTSTORE.PASSWORD=ENC(...)
### (2) 폐쇄망 한정 자체서명 신뢰(명시적 opt-in) - 기본 false
#ES.SSL.TRUST_SELF_SIGNED=true
#ES.SSL.DISABLE_HOSTNAME_VERIFY=false

### (3) 모든 인증서 신뢰
ES.SSL.DISABLE_HOSTNAME_VERIFY=true
ES.SSL.TRUST_ALL=true

### SFTP 호스트키 검증 - known_hosts 미설정 시 폐쇄망 한정 opt-in (기본 false)
#SFTP.DISABLE_HOST_KEY_CHECK=false

